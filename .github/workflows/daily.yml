name: daily-status

# 每个工作日美股收盘后跑 daily_status.py,生成 index.html / status.json。
# 发布方式:GitHub Pages「用 Actions 部署」——把产物作为 artifact 上传部署,
#   不再每天 commit 回仓库,所以 main 分支不会被每日提交刷屏。
# 缓存持久化:每月把 backtest_outputs/cache 与 data_manual 提交回仓库一次
#   (本月首次成功运行;见文末 "Commit cache monthly")。
#   依据:daily_status.py 的 fetch_yahoo 一次抓最近 3 个月(≈63 交易日),
#   远大于一个月空档(≈21 交易日),3 倍冗余,断档风险基本为零。
# 注意:GitHub 定时任务用 UTC,且高峰期可能延迟几分钟到几十分钟(对每天一次无影响)。

on:
  schedule:
    # 广度来源从 22:00 UTC 开始更新，留出生成和发布的时间。
    - cron: "50 4 * * 2-6"   # 对应美股周一至周五收盘后，东京次日 13:50
  workflow_dispatch:           # 也可在 Actions 页面手动触发(手动触发只发布、不提交缓存)

permissions:
  contents: write              # 每月提交缓存需要写仓库
  pages: write                 # 部署 GitHub Pages
  id-token: write              # Pages 部署的 OIDC 鉴权

concurrency:
  group: daily-status
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Restore daily indicator cache
        uses: actions/cache/restore@v4
        with:
          path: backtest_outputs/cache/live
          key: daily-indicators-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: daily-indicators-v1-

      - name: Run daily status
        run: python daily_status.py

      - name: Save daily indicator cache
        if: ${{ hashFiles('backtest_outputs/cache/live/*.csv') != '' }}
        uses: actions/cache/save@v4
        with:
          path: backtest_outputs/cache/live
          key: daily-indicators-v1-${{ github.run_id }}-${{ github.run_attempt }}

      # ---- 每天:把产物作为 Pages artifact 部署(不写回仓库) ----
      - name: Prepare site
        run: |
          mkdir -p _site
          cp index.html status.json _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@v4

      # ---- 每月一次:把缓存提交回仓库(本月首次成功运行) ----
      # 原逻辑是「每月第一个周一」,但若那天恰逢运行被取消/失败(如 2026-09-07 那次),
      # 整个月就不会提交。改成「本月尚未提交过就提交」,自动补上漏掉的月份。
      # 注意:提交范围必须覆盖非 csv/json 的缓存(如 h15_all.zip)与 data_manual/,
      # 否则手工刷新的数据永远进不了仓库、Actions 每次 checkout 都拿到旧的。
      - name: Commit cache monthly
        if: ${{ github.event_name == 'schedule' }}
        run: |
          THIS_MONTH=$(date -u +%Y-%m)
          LAST_MONTH=$(git log -1 --format=%cd --date=format:%Y-%m -- backtest_outputs/cache || true)
          if [ "$LAST_MONTH" != "$THIS_MONTH" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add backtest_outputs/cache data_manual
            if git diff --cached --quiet; then
              echo "缓存无变化,跳过提交"
            else
              git commit -m "chore: monthly cache $(date -u +%F) [skip ci]"
              git push
            fi
          else
            echo "本月($THIS_MONTH)已提交过缓存,跳过"
          fi
